spring:
  application:
    name: enacademy-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/enacademy}
    username: ${DATABASE_USER:enacademy}
    password: ${DATABASE_PASSWORD:enacademy}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties.mail.smtp.auth: false
    properties.mail.smtp.starttls.enable: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${SERVER_MAX_THREADS:200}
      min-spare: ${SERVER_MIN_SPARE_THREADS:20}
    accept-count: ${SERVER_ACCEPT_COUNT:200}
    max-connections: ${SERVER_MAX_CONNECTIONS:1000}
  compression:
    enabled: true
    min-response-size: 1KB
  error:
    include-message: never

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

springdoc:
  swagger-ui:
    path: /docs
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    filter: true
    persist-authorization: false
    doc-expansion: none

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:logstash}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  jwt:
    issuer: ${JWT_ISSUER:enacademy}
    secret: ${JWT_SECRET:change-this-development-secret-before-production-123456}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  admin:
    name: ${APP_ADMIN_NAME:ENAcademy Admin}
    email: ${APP_ADMIN_EMAIL:admin@enacademy.local}
    password: ${APP_ADMIN_PASSWORD:ChangeMe123!}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    password-reset-minutes: ${PASSWORD_RESET_MINUTES:60}
    token-retention-days: ${TOKEN_RETENTION_DAYS:7}
    token-cleanup-cron: "${TOKEN_CLEANUP_CRON:0 20 3 * * *}"
